[defaults]
inventory           = inventories/staging/hosts.yaml
roles_path          = roles
remote_user         = deploy
private_key_file    = ~/.ssh/deploy_key
host_key_checking   = True
retry_files_enabled = False
stdout_callback     = yaml

vault_password_file = ~/.vault_pass

[privilege_escalation]
become          = True
become_method   = sudo
become_user     = root
become_ask_pass = False

[ssh_connection]
pipelining      = True
control_persist = 60s

#i put remote user and privatekeyfile here so i dont repeat in every hostfile
# vault_password_file points to local file on operators machine, never commited to git