---
docker_conflicting_packages:
  - docker.io
  - docker-compose
  - docker-doc
  - podman-docker
  - containerd
  - runc

# By default this role installs the latest stable Docker packages available from
# Docker's official Debian repository. To pin an exact Docker release, replace
# the package names below with versioned package strings discovered with
# `apt-cache madison docker-ce`, for example:
#   docker-ce=5:29.4.1-1~debian.13~trixie
#   docker-ce-cli=5:29.4.1-1~debian.13~trixie
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

docker_apt_keyring_dir: /etc/apt/keyrings
docker_apt_keyring_file: "{{ docker_apt_keyring_dir }}/docker.asc"
docker_apt_sources_file: /etc/apt/sources.list.d/docker.sources

docker_manage_group_membership: false
docker_users: []
