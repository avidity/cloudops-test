---
# which backend to use: vault | ssm | ansible_vault (fallback)
secrets_backend: ansible_vault

# HashiCorp Vault settings (used when secrets_backend == vault)
vault_addr: "https://vault.internal:8200"
vault_auth_method: approle        # approle | aws_iam | token
vault_secrets_path: "secret/data/{{ env }}/app"
vault_token: "{{ lookup('env', 'VAULT_TOKEN') }}"

# AWS SSM settings (used when secrets_backend == ssm)
ssm_region: "eu-north-1"
ssm_path_prefix: "/{{ env }}/app"
