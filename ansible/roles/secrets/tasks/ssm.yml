---
# Fetch secrets from AWS SSM Parameter Store
# Requires: AWS credentials in environment (IAM role or AWS_ACCESS_KEY_ID)

- name: Fetch secrets from SSM
  community.aws.ssm_parameter:
    name: "{{ ssm_path_prefix }}/{{ item }}"
    region: "{{ ssm_region }}"
    with_decryption: true
  register: ssm_results
  loop:
    - pg_app_user
    - pg_app_password
    - pg_readonly_user
    - pg_readonly_password
    - redis_password
    - deploy_ssh_public_key
    - s3_access_key
    - s3_secret_key
  no_log: true

- name: Set secret facts from SSM response
  ansible.builtin.set_fact:
    vault_postgresql_app_user: "{{ ssm_results.results | selectattr('item', 'eq', 'pg_app_user') | map(attribute='value') | first }}"
    vault_postgresql_app_password: "{{ ssm_results.results | selectattr('item', 'eq', 'pg_app_password') | map(attribute='value') | first }}"
    vault_postgresql_readonly_user: "{{ ssm_results.results | selectattr('item', 'eq', 'pg_readonly_user') | map(attribute='value') | first }}"
    vault_postgresql_readonly_password: "{{ ssm_results.results | selectattr('item', 'eq', 'pg_readonly_password') | map(attribute='value') | first }}"
    vault_redis_password: "{{ ssm_results.results | selectattr('item', 'eq', 'redis_password') | map(attribute='value') | first }}"
    vault_deploy_ssh_public_key: "{{ ssm_results.results | selectattr('item', 'eq', 'deploy_ssh_public_key') | map(attribute='value') | first }}"
    vault_s3_access_key: "{{ ssm_results.results | selectattr('item', 'eq', 's3_access_key') | map(attribute='value') | first }}"
    vault_s3_secret_key: "{{ ssm_results.results | selectattr('item', 'eq', 's3_secret_key') | map(attribute='value') | first }}"
  no_log: true
