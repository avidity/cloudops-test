---
# Fetch secrets from HashiCorp Vault at runtime
# Requires: VAULT_TOKEN or vault_approle_role_id + vault_approle_secret_id in env

- name: Fetch secrets from Vault
  community.hashi_vault.vault_kv2_get:
    url: "{{ vault_addr }}"
    path: "{{ vault_secrets_path }}"
    auth_method: "{{ vault_auth_method }}"
    token: "{{ vault_token | default(omit) }}"
  register: vault_secrets
  no_log: true

- name: Set secret facts from Vault response
  ansible.builtin.set_fact:
    vault_postgresql_app_user: "{{ vault_secrets.secret.pg_app_user }}"
    vault_postgresql_app_password: "{{ vault_secrets.secret.pg_app_password }}"
    vault_postgresql_readonly_user: "{{ vault_secrets.secret.pg_readonly_user }}"
    vault_postgresql_readonly_password: "{{ vault_secrets.secret.pg_readonly_password }}"
    vault_redis_password: "{{ vault_secrets.secret.redis_password }}"
    vault_deploy_ssh_public_key: "{{ vault_secrets.secret.deploy_ssh_public_key }}"
    vault_nginx_ssl_cert: "{{ vault_secrets.secret.ssl_cert }}"
    vault_nginx_ssl_key: "{{ vault_secrets.secret.ssl_key }}"
    vault_s3_access_key: "{{ vault_secrets.secret.s3_access_key }}"
    vault_s3_secret_key: "{{ vault_secrets.secret.s3_secret_key }}"
  no_log: true
