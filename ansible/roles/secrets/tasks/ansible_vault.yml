---
# Fallback: load from ansible-vault encrypted file
# Used in local dev or when Vault/SSM is not available
# Secrets must already be in group_vars/all/vault.yml (encrypted)

- name: Verify vault.yml exists and is encrypted
  ansible.builtin.stat:
    path: "{{ playbook_dir }}/../group_vars/all/vault.yml"
  register: vault_file

- name: Warn if using ansible-vault fallback in production
  ansible.builtin.debug:
    msg: >
      WARNING: using ansible_vault backend for secrets.
      Consider switching to HashiCorp Vault or SSM for production.
  when: env | default('production') == 'production'

# Secrets are already loaded via vars_files in the playbook when this task runs
- name: Assert vault variables are loaded
  ansible.builtin.assert:
    that: vault_postgresql_app_password is defined
    fail_msg: "vault.yml not loaded — add it to vars_files or decrypt with --vault-password-file"
