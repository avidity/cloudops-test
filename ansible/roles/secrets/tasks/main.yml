---
- name: Fetch secrets from backend
  ansible.builtin.include_tasks: "{{ secrets_backend }}.yml"

- name: Assert required secrets are populated
  ansible.builtin.assert:
    that:
      - vault_postgresql_app_password is defined
      - vault_postgresql_app_password | length > 0
      - vault_redis_password is defined
      - vault_redis_password | length > 0
    fail_msg: "Required secrets not loaded — check secrets_backend config"
    quiet: true
