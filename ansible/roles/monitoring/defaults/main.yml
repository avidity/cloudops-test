---
# bump versions here to upgrade, then re-run the role
node_exporter_version: "1.8.2"
nginx_exporter_version: "1.3.0"
prometheus_version: "2.53.4"
grafana_version: "11.*"

monitoring_bin_dir: /usr/local/bin
monitoring_user: prometheus

prometheus_config_dir: /etc/prometheus
prometheus_data_dir: /var/lib/prometheus
prometheus_retention: 30d
prometheus_port: 9090

node_exporter_port: 9100
nginx_exporter_port: 9113
postgres_exporter_port: 9187   # TODO: add postgres_exporter install

grafana_port: 3000
grafana_datasource_name: Prometheus
grafana_provisioning_dir: /etc/grafana/provisioning

prometheus_scrape_interval: 15s
prometheus_evaluation_interval: 15s

monitoring_arch: "{{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }}"
