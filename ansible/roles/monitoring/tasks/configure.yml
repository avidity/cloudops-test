---
- name: Deploy prometheus.yml
  ansible.builtin.template:
    src: prometheus.yml.j2
    dest: "{{ prometheus_config_dir }}/prometheus.yml"
    owner: "{{ monitoring_user }}"
    group: "{{ monitoring_user }}"
    mode: "0644"
    validate: "{{ monitoring_bin_dir }}/promtool check config %s"
  notify: Restart prometheus

- name: Deploy Grafana prometheus datasource
  ansible.builtin.template:
    src: grafana-datasource.yml.j2
    dest: "{{ grafana_provisioning_dir }}/datasources/prometheus.yml"
    owner: grafana
    group: grafana
    mode: "0640"
  notify: Restart grafana

- name: Ensure all monitoring services are started and enabled
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
    daemon_reload: true
  loop:
    - node_exporter
    - nginx_exporter
    - prometheus
    - grafana-server
