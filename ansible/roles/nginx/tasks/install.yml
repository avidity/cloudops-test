---
- name: Add Nginx mainline APT signing key
  ansible.builtin.apt_key:
    url: https://nginx.org/keys/nginx_signing.key
    state: present

- name: Add Nginx mainline APT repository
  ansible.builtin.apt_repository:
    repo: "deb https://nginx.org/packages/mainline/debian {{ ansible_distribution_release }} nginx"
    state: present
    filename: nginx

- name: Install Nginx {{ nginx_version }}
  ansible.builtin.apt:
    name: "nginx={{ nginx_version }}"
    state: present
    update_cache: true

- name: Ensure Nginx service is enabled
  ansible.builtin.service:
    name: nginx
    enabled: true
