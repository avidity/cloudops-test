---
dependency:
  name: galaxy
driver:
  name: docker
platforms:
  - name: nginx-test
    image: geerlingguy/docker-debian12-ansible
    pre_build_image: true
    privileged: true
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    cgroupns_mode: host
provisioner:
  name: ansible
  inventory:
    host_vars:
      nginx-test:
        nginx_server_name: test.local
        app_bind: "127.0.0.1"
        app_port: 8000
        vault_nginx_ssl_cert: "{{ lookup('file', 'files/test.crt') }}"
        vault_nginx_ssl_key: "{{ lookup('file', 'files/test.key') }}"
verifier:
  name: ansible
