---
- name: Ensure persistent journal directory exists
  ansible.builtin.file:
    path: "{{ journald_persistent_dir }}"
    state: directory
    owner: root
    group: systemd-journal
    mode: "2755"

- name: Ensure journald drop-in directory exists
  ansible.builtin.file:
    path: "{{ journald_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Configure journald retention and file rotation
  ansible.builtin.copy:
    dest: "{{ journald_dropin_file }}"
    owner: root
    group: root
    mode: "0644"
    content: |
      [Journal]
      Storage={{ journald_storage }}
      MaxRetentionSec={{ journald_max_retention_sec }}
      MaxFileSec={{ journald_max_file_sec }}
  notify: restart journald
