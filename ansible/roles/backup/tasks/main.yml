- name: Install cron
  ansible.builtin.apt:
    name: cron
    state: present
    update_cache: yes

- name: Create backup script
  ansible.builtin.copy:
    dest: /usr/local/bin/backup-db.sh
    mode: '0755'
    content: |
      #!/bin/bash
      TIMESTAMP=$(date +%F-%H-%M)
      FILE="/tmp/app-db-$TIMESTAMP.sql.gz"

      pg_dump app | gzip > "$FILE"

- name: Schedule hourly backup
  ansible.builtin.cron:
    name: "db backup"
    minute: "0"
    job: "/usr/local/bin/backup-db.sh"
    