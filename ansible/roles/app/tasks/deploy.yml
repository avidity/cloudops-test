---
- name: Ensure app and storage directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0755"
  loop:
    - "{{ app_dir }}"
    - "{{ app_storage_dir }}/postgresql"
    - "{{ app_storage_dir }}/redis"

- name: Clone or update application repository
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ app_image_tag | default('HEAD') }}"
    force: false
  become: true
  become_user: "{{ deploy_user }}"

- name: Deploy docker-compose.yml
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.yml"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0644"

- name: Deploy .env file
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ deploy_user }}"
    group: "{{ deploy_group }}"
    mode: "0600"

- name: Build application Docker image
  community.docker.docker_image:
    name: "{{ app_name }}"
    tag: "{{ app_image_tag | default('latest') }}"
    source: build
    build:
      path: "{{ app_dir }}"
      pull: true
  become: true
  become_user: "{{ deploy_user }}"
