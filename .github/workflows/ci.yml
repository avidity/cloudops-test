name: Ansible CI/CD

on:
  push:
    branches:
      - aq-test # keep it only for test, then remove it and uncomment the following lines
      - staging
      - main
  pull_request:

jobs:
  lint:
    name: Lint Ansible
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install ansible ansible-lint

      - name: Run ansible-lint
        run: ansible-lint ansible/ || true
